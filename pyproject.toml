[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "priorneuralnet-mcp"
version = "0.1.0"
description = "Domain-Prior Mask-Constrained Neural Networks: interpretable, sparsity-constrained PyTorch heads for p >> n tabular data, with head-to-head benchmarking against parameter-matched MLPs and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex" }]
keywords = [
    "interpretable-ml",
    "structured-sparsity",
    "bioinformatics",
    "integrated-gradients",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "plotly>=5.20",
    "jinja2>=3.1",
    "mcp[cli]>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: typer.Option defaults in signatures

[project.scripts]
priorneuralnet = "priorneuralnet.cli:app"
priorneuralnet-mcp = "priorneuralnet.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/priorneuralnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
